  <!-- Chart line -->
  <path
    d="M80 320C130 280 180 340 230 300C280 260 330 320 380 280C430 240 480 300 520 260"
    stroke="#2E7D32"
    stroke-width="3"
    fill="none"
  />
  <!-- Chart points -->
  <circle cx="80" cy="320" r="4" fill="#2E7D32" />
  <circle cx="130" cy="280" r="4" fill="#2E7D32" />
  <circle cx="180" cy="340" r="4" fill="#2E7D32" />
  <circle cx="230" cy="300" r="4" fill="#2E7D32" />
  <circle cx="280" cy="260" r="4" fill="#2E7D32" />
  <circle cx="330" cy="320" r="4" fill="#2E7D32" />
  <circle cx="380" cy="280" r="4" fill="#2E7D32" />
  <circle cx="430" cy="240" r="4" fill="#2E7D32" />
  <circle cx="480" cy="300" r="4" fill="#2E7D32" />
  <circle cx="520" cy="260" r="4" fill="#2E7D32" />

  <!-- Navigation -->
  <rect x="50" y="380" width="450" height="40" rx="8" fill="#E8F5E9" />
  <circle cx="100" cy="400" r="12" fill="#2E7D32" />
  <circle cx="200" cy="400" r="12" fill="#C5E8C6" />
  <circle cx="300" cy="400" r="12" fill="#C5E8C6" />
  <circle cx="400" cy="400" r="12" fill="#C5E8C6" />
  <circle cx="500" cy="400" r="12" fill="#C5E8C6" />
